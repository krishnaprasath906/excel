<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel AutoFill Popup</title>
  <style>
    body {
      width: 360px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }
    .badge {
      background: #4f46e5;
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      background: #4f46e5;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #4338ca;
    }
    .notice {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="font-size: 20px;">⚡</div>
    <div>
      <h3 style="margin: 0; font-size: 15px;">Excel AutoFill</h3>
      <span class="badge">Manifest V3 Ready</span>
    </div>
  </div>

  <div class="card">
    <div style="font-size: 13px; font-weight: 600; margin-bottom: 6px;">Active Tab Assistant</div>
    <div style="font-size: 12px; color: #cbd5e1; margin-bottom: 10px;">
      Easily autofill this active web form using records from your Excel AutoFill dashboard.
    </div>
    <button class="btn" id="open-dashboard-btn">Open Web App Dashboard</button>
  </div>

  <div class="card">
    <div style="font-size: 12px; color: #fbbf24; font-weight: 600; margin-bottom: 4px;">
      🛡 Manual Review Enforced
    </div>
    <div style="font-size: 11px; color: #94a3b8;">
      Forms are pre-filled upon your review. Submit buttons are never clicked automatically.
    </div>
  </div>

  <div class="notice">Excel AutoFill v1.0.0 &bull; 100% Client-Side</div>
  <script src="popup.js"></script>
</body>
</html>
